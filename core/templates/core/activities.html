<h1>Activities</h1>

<form method="GET">
    <input name="q" placeholder="Search..." value="{{ params.q }}">
    
    <select name="city">
        <option value="">All Cities</option>
        {% for city in cities %}
            <option value="{{ city }}" {% if params.city == city %}selected{% endif %}>{{ city }}</option>
        {% endfor %}
    </select>

    <div class="filter-group">
        <label>Price Range ($0 - $100):</label>
        <input name="min_price" type="number" placeholder="Min" value="{{ params.min_price }}">
        <input name="max_price" type="number" placeholder="Max" value="{{ params.max_price }}">
    </div>

    <div class="filter-group">
        <p>Categories:</p>
        {% for cat in categories %}
            <label><input type="checkbox" name="category" value="{{ cat }}" 
                {% if cat in selected_categories %}checked{% endif %}> {{ cat|title }}</label>
        {% endfor %}
    </div>

    <button type="submit">Filter</button>
</form>

<hr>


{% for a in activities %}
    <div>
        <h3>{{ a.name }}</h3>
        <p>{{ a.city }}, {{ a.country }}</p>
        <p>${{ a.price }} ({{ a.duration }}h)</p>

        <button onclick="likePlace('activity', {{ a.id }})">❤️ Like</button>

        <button onclick="addToItinerary(
            'activity',
            {{ a.id }},
            '{{ a.name|escapejs }}',
            {{ a.lat }},
            {{ a.lng }}
        )">
            ➕ Add to itinerary
        </button>
    </div>
{% endfor %}

<script>
function likePlace(type, id) {
    fetch("/like/", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": getCSRF()
        },
        body: `type=${type}&id=${id}`
    })
    .then(res => res.json())
    .then(data => console.log(data));
}

function addToItinerary(type, id, name, lat, lng) {
    fetch("/add-to-itinerary/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCSRF()
        },
        body: JSON.stringify({
            type, id, name, lat, lng
        })
    })
    .then(res => res.json())
    .then(data => alert("Added to itinerary"));
}

function getCSRF() {
    let cookies = document.cookie.split(';');
    for (let c of cookies) {
        if (c.trim().startsWith('csrftoken=')) {
            return c.split('=')[1];
        }
    }
}
</script>
