{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Trevia</title>
    <link rel="stylesheet" href="{% static 'explore.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <div class="page-wrapper">
        <main class="content-area">
            {% include 'components/header.html' %}
            <section class="first-section">
                <div class="explore-div">
                    <h2 class="text-explore">EXPLORE</h2>
                </div>
                <div class="explore-categories">

                    <div class="category"></div>
                    <div class="category"></div>
                    <div class="category"></div>
                    <div class="category"></div>
                    <div class="category"></div>
                    <div class="category"></div>

                </div>
            </section>
            <section class="second-section">
            </section>
            <section class="third-section">
                <div id="map"></div>
            </section>
        </main>
    </div>

    <footer>
    </footer>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=7af13a42-8ae5-4930-8b11-50aa988d021a&lang=uz_UZ" type="text/javascript"></script>

    <script type="text/javascript">
    
        ymaps.ready(init);
    
       
    
        function init() {
    
            var myMap = new ymaps.Map("map", {
    
                center: [41.2995, 69.2401], // Tashkent
    
                zoom: 12,
    
                controls: ['zoomControl', 'fullscreenControl']
    
            });
    
    
    
            var myPlacemark;
    
    
    
            myMap.events.add('click', function (e) {
    
                var coords = e.get('coords');
    
    
    
                // Debugging: This will show in your browser console (F12)
    
                console.log("Map clicked at: ", coords);
    
    
    
                if (myPlacemark) {
    
                    myMap.geoObjects.remove(myPlacemark);
    
                }
    
               
    
                // Create the marker
    
                myPlacemark = new ymaps.Placemark(coords, {
    
                    balloonContent: 'Yetkazib berish nuqtasi'
    
                }, {
    
                    preset: 'islands#redDotIcon',
    
                    draggable: false
    
                });
    
    
    
                myMap.geoObjects.add(myPlacemark);
    
    
    
                // Save coordinates to the hidden input
    
                // Formatting exactly for your Python split(',')
    
                var lat = coords[0].toFixed(6);
    
                var lng = coords[1].toFixed(6);
    
                document.getElementById('location_coords').value = lat + "," + lng;
    
            });
    
        }
    
    </script>
</body>
</html>
